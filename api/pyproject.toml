[project]
name = "ai-chat-api"
version = "0.1.0"
description = "FastAPI backend for AI chat via OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "openai>=1.55",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]